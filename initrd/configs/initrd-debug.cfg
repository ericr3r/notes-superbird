# Debug-initrd-only kernel options.
#
# These are layered on top of the nerves_system_superbird fragments
# (kernel/superbird.cfg, superbird-disable.cfg, superbird-usb-host.cfg) so that
# the kernel built here is otherwise IDENTICAL to the one nerves_system_superbird
# builds. That is the whole point: you USB-boot this kernel + a RAM initrd to
# debug the exact kernel/DTB that fails to boot from eMMC, without touching the
# eMMC rootfs.
#
# The only additions are the USB-gadget networking transport the initrd uses to
# give you an SSH shell over USB.

# Legacy g_ether gadget. /etc/init.d/S49gether runs `modprobe g_ether` to bring
# up usb0 (172.16.42.2) for SSH over USB. The nerves image instead uses the
# configfs/NCM gadget (CONFIG_USB_CONFIGFS_NCM), so legacy g_ether is not built
# there. Adding it as a module here is purely additive - it does not change the
# boot path being debugged.
CONFIG_USB_ETH=m
CONFIG_USB_ETH_RNDIS=y
